<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1820" viewBox="0 0 1800 1820">
<title>层归一化 LayerNorm：从 x 到 x_norm1 的计算过程</title>
<desc>使用当前 gpt2toy 首次 norm1 前向的 float32 数值，展示每个 token 独立沿特征维计算均值、方差、带 epsilon 的标准差、标准化和可学习仿射变换。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="1800" height="1820" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="60" y="63" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="600" fill="#111827" text-anchor="start">层归一化的计算过程</text>
<text x="1740" y="63" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="29" font-weight="600" fill="#2563eb" text-anchor="end">x_norm1 = self.norm1(x)</text>
<text x="60" y="110" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="start">Layer Normalization  ·  每个 token 的 4 个特征独立归一化  ·  dim = -1</text>
<rect x="60" y="148" width="1680" height="252" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="84" y="186" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#2563eb" text-anchor="start">输入：x</text>
<text x="1714" y="186" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">shape = (B, T, D) = (1, 4, 4)</text>
<text x="110" y="224" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">token / ID</text>
<text x="550" y="224" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">d0</text>
<text x="880" y="224" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">d1</text>
<text x="1210" y="224" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">d2</text>
<text x="1540" y="224" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">d3</text>
<rect x="80" y="232" width="1640" height="37" rx="6" fill="#eff6ff" stroke="#eff6ff" stroke-width="1.5"/>
<text x="110" y="260" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#2563eb" text-anchor="start">Hello / 2</text>
<text x="550" y="260" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">0.80185723</text>
<text x="880" y="260" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-0.15227951</text>
