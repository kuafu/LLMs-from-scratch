<rect x="60" y="446" width="1680" height="110" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="482" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#2563eb" text-anchor="start">展开 Hello 这一行：x[0, 0, :]</text>
<text x="900" y="525" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#111827" text-anchor="middle">[0.80185723, -0.15227951, 0.21122205, -3.89896703]</text>
<text x="390" y="596" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">x</text>
<text x="1280" y="596" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">x</text>
<rect x="60" y="620" width="620" height="140" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="656" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#2563eb" text-anchor="start">① 均值 mean（μ）</text>
<text x="84" y="694" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#111827" text-anchor="start">mean = x.mean(dim=-1, keepdim=True)</text>
<text x="84" y="735" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#2563eb" text-anchor="start">Hello: μ = sum(x) / 4 = -0.75954181</text>
<text x="735" y="673" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">mean</text>
<rect x="790" y="620" width="950" height="140" rx="14" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="814" y="656" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#7c3aed" text-anchor="start">中心化：每个特征减去本行均值</text>
<text x="814" y="694" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#111827" text-anchor="start">centered = x - mean</text>
<text x="814" y="735" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">[1.56139898, 0.60726231, 0.97076386, -3.13942528]</text>
<text x="715" y="785" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">平方后求平均</text>
<text x="1290" y="913" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#7c3aed" text-anchor="start">x - mean</text>
<rect x="60" y="830" width="620" height="150" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="866" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#2563eb" text-anchor="start">② 总体方差 var（σ²）</text>
<text x="84" y="899" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#111827" text-anchor="start">var = x.var(-1, keepdim=True, unbiased=False)</text>
<text x="84" y="934" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#111827" text-anchor="start">var = sum((x - mean)²) / D，D = 4</text>
<text x="84" y="965" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#2563eb" text-anchor="start">Hello: var = 3.40127683</text>
<text x="395" y="1019" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">var</text>
<rect x="60" y="1040" width="620" height="140" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="1076" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#2563eb" text-anchor="start">③ 归一化除数 std</text>
<text x="84" y="1110" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#111827" text-anchor="start">std = sqrt(var + eps), eps = 0.00001</text>
<text x="84" y="1154" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#2563eb" text-anchor="start">Hello: std = 1.84425783</text>
<text x="735" y="1091" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#64748b" text-anchor="middle">std</text>
<rect x="790" y="1040" width="950" height="140" rx="14" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="814" y="1076" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#7c3aed" text-anchor="start">④ 标准化 norm_x</text>
<text x="814" y="1110" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">norm_x = (x - mean) / std</text>
<text x="814" y="1154" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">[0.84662730, 0.32927191, 0.52637100, -1.70227027]</text>
<text x="1290" y="1227" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">norm_x</text>
<rect x="60" y="1250" width="620" height="150" rx="14" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="84" y="1286" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#059669" text-anchor="start">可学习参数：所有 token 共享</text>
<text x="84" y="1323" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">scale = γ = [1, 1, 1, 1]</text>
<text x="84" y="1361" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">shift = β = [0, 0, 0, 0]</text>
<text x="655" y="1384" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="end">shape = (4,)</text>
<text x="735" y="1306" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">γ, β</text>
<rect x="790" y="1250" width="950" height="150" rx="14" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="814" y="1286" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#059669" text-anchor="start">⑤ 缩放和平移 → out / x_norm1</text>
<text x="814" y="1323" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">out = self.scale * norm_x + self.shift</text>
<text x="814" y="1361" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#111827" text-anchor="start">[0.84662730, 0.32927191, 0.52637100, -1.70227027]</text>
<text x="814" y="1387" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">当前 scale = 1、shift = 0，因此 out = norm_x。</text>
<rect x="60" y="1470" width="1680" height="252" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="84" y="1508" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#059669" text-anchor="start">输出：x_norm1（其余三行各自按同样过程计算）</text>
<text x="1714" y="1508" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">shape = (B, T, D) = (1, 4, 4)</text>
