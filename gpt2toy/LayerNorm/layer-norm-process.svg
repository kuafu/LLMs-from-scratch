<text x="1540" y="260" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-3.89896703</text>
<text x="110" y="299" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="start">, / 3</text>
<text x="550" y="299" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">3.20701933</text>
<text x="880" y="299" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-0.39497244</text>
<text x="1210" y="299" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">1.58786070</text>
<text x="1540" y="299" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-1.39875591</text>
<text x="110" y="338" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="start">I / 4</text>
<text x="550" y="338" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-0.27022433</text>
<text x="880" y="338" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-0.41580868</text>
<text x="1210" y="338" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-0.66636026</text>
<text x="1540" y="338" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">-0.28722513</text>
<text x="110" y="377" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="start">am / 5</text>
<text x="550" y="377" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111827" text-anchor="middle">1.10217988</text>
